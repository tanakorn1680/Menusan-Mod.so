name: Build ProMenu (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ImGui and AML headers
        run: bash setup.sh

      - name: Build with ndk-build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          set +e
          "$NDK/ndk-build" -j"$(nproc)" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk > build.log 2>&1
          rc=$?
          set -e
          tail -n 8 build.log
          if [ $rc -ne 0 ]; then
            PAT="NDK:|error|fatal|undefined reference|No such file"
            grep -E "$PAT" build.log | head -10 | sed "s#/home/runner/work/[^/]*/[^/]*/##" | cut -c1-350 | sed "s/%/%25/g" | while IFS= read -r l; do echo "::error::$l"; done
            { echo "### First build errors"; echo "\`\`\`"; grep -E "$PAT" build.log | head -40 | sed "s#/home/runner/work/[^/]*/[^/]*/##"; echo "\`\`\`"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      # Both copies staged into one folder so the run page offers a single download instead of two:
      # libProMenu64.so (install this one) and libProMenu64-symbols.so (unstripped — with it a
      # crash offset such as "libProMenu64.so + 0x2b69c" in the game's crash log can be turned into
      # a function name and line number: llvm-addr2line -f -C -i -e libProMenu64-symbols.so 0x2b69c,
      # llvm-addr2line is in the NDK: toolchains/llvm/prebuilt/*/bin/)
      - name: Stage artifacts
        run: |
          mkdir -p out
          cp libs/arm64-v8a/libProMenu64.so out/libProMenu64.so
          cp obj/local/arm64-v8a/libProMenu64.so out/libProMenu64-symbols.so

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: libProMenu64
          path: out/
